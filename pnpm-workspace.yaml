packages:
  - apps/docs
  - apps-sfdx

engineStrict: true

# Keep pnpm-lock.yaml a single YAML document. With any other value pnpm writes a leading "env"
# document (its own binaries) before the real lockfile, and GitHub's dependency graph only reads
# the first document - so Dependabot sees ~57 packages instead of ~3,400 and stops alerting
# (https://github.com/dependabot/dependabot-core/issues/15904).
# This also stops pnpm switching itself to the pinned version. Corepack (local), pnpm/action-setup
# (CI) and the Dockerfiles already run the pinned version, and scripts/check-package-manager.mjs
# fails installs run by any other version.
pmOnFail: ignore

# Allow installing root-level dependencies
ignoreWorkspaceRootCheck: true

# Wait 3 days before upgrading packages
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@jetstreamapp/*"
  # Remove these after 3 days
  # Required for macos build: https://github.com/electron-userland/electron-builder/issues/10066
  - app-builder-lib@26.16.1
  - dmg-builder@26.16.1
  - electron-builder-squirrel-windows@26.16.1
  - electron-builder@26.16.1

# Allow scripts from these specific libraries
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@sentry/cli": false
  "@swc/core": true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  less: false
  node: false
  nx: true
  prisma: true
  sharp: true
  spawn-sync: false
  unrs-resolver: true

overrides:
  "@babel/traverse": ">=7.23.2 <8.0.0"
  # Force a patched @xmldom/xmldom on the unauthenticated SAML response-validation path
  # (@node-saml/node-saml -> xml-crypto/xml-encryption). 0.8.11 is below the 0.8.12 (injection)
  # and 0.8.13 (recursion DoS, GHSA-2v35-w6hq-6mfw) patches, both backported to the 0.8.x line.
  # Must stay on 0.8.x: xml-crypto (even at latest) calls DOMParser.parseFromString without a
  # mimeType, which 0.9.x rejects with a TypeError — forcing 0.9.x breaks SAML signature
  # signing AND verification (every SSO login) at runtime.
  "@xmldom/xmldom": "^0.8.15"
  # Force a patched @xhmikosr/decompress on the dev-only @swc/cli binary-download path
  # (@swc/cli -> @xhmikosr/bin-wrapper -> downloader -> decompress). <10.2.1 allows archive
  # extraction to write files/links outside the target dir (GHSA-mp2f-45pm-3cg9), and <10.2.2 (11.x:
  # <11.1.4) still allows it through a symlink chain (GHSA-hrh2-vp3x-79xf). downloader 16.3 declares
  # ^11.1.3, which also brings the readers onto file-type 21 (20.x has an ASF-parser infinite loop and
  # a ZIP decompression bomb, GHSA-5v7r-6r5c-r473 / GHSA-j47w-4g3g-c36v). Do not force file-type 21 on
  # the 8.x readers instead: they check for ext "gz" and silently extract nothing from a .tar.gz.
  "@xhmikosr/decompress": "^11.1.4"
  # Docusaurus 3.10 still declares tinypool ^1, and <2.1.2 has prototype-pollution gadgets in the
  # worker options that lead to RCE (GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr). Docs build only.
  # tinypool 2.0's only breaking change is dropping Node 18.
  "@docusaurus/core>tinypool": "^2.1.2"
  # @react-email/ui (the `email:dev` preview server) pins next to exactly 16.3.3, which has an RCE
  # in next/og ImageResponse (GHSA-vcvr-r3jv-pc5j) and an image-optimizer SSRF (GHSA-cjq9-62q9-8jv4).
  # Keep this matching the root next (16.4.1 fixes two RCEs, GHSA-2464-fhr4-w9xw / GHSA-673q-mjm6-r5xr) so the
  # tree dedupes to one version.
  "@react-email/ui>next": "^16.4.2"
  # release-it 21.1.0 pins undici 7.29.0, which can skip TLS certificate validation on a dropped
  # connection (GHSA-w293-vg96-wgc3). release-it calls the GitHub API with a token in CI.
  # release-it 21.1.1 ships the patched pin: remove this after upgrading release-it.
  "release-it>undici": "^7.29.1"
  # nx 23.3.0 (latest) pins undici 7.29.0 exactly, the same TLS-validation and request-handling advisories
  # (GHSA-w293-vg96-wgc3 and nine more) as release-it above. Dev tooling only. Remove after a nx release that
  # pins >=7.29.1.
  "nx>undici": "^7.29.1"
  # <7.0.3 allows RCE via RegExp.flags / Date.prototype (GHSA-5c6j-r48x-rmvq). Docs build only
  # (copy-webpack-plugin, css-minimizer-webpack-plugin). 7.0's only breaking change is requiring Node 20+.
  serialize-javascript: "^7.0.5"
  axios: "^1.16.1"
  "connect-pg-simple>@types/express-session": "^1.18.2"
  # monaco-editor pins dompurify exactly (0.57 still pins 3.4.15). <3.4.17 lets split template
  # expressions survive SAFE_FOR_TEMPLATES in shadow-root content (GHSA-cg2g-xh64-v4q7).
  dompurify: "^3.4.17"
  handlebars: "4.7.9"
  # <1.9.0 has a quadratic-complexity DoS in parse(), and <1.11.0 has a quote() command injection
  # via a line terminator (GHSA-pqg4-j6r4-53mv). Dev tooling only: npm-run-all, web-ext, docusaurus
  shell-quote: "^1.11.0"
  # Force a patched tar on the electron-builder/node-gyp build-tool chain (app-builder-lib and
  # node-gyp resolve tar 7.5.16). <=7.5.18 allows a decompression/parse DoS via unlimited input
  # (GHSA-23hp-3jrh-7fpw). 7.5.20 matches our direct dependency and stays within both consumers'
  # ^7.x ranges, deduping the tree to a single tar version.
  tar: "^7.5.20"
  "next-images>loader-utils": "2.0.4"
  # prisma 7.10 pins mysql2 3.15.3 exactly: <3.22.0 downgrades auth to mysql_clear_password and leaks
  # credentials (GHSA-3f6p-5ww8-9rcr), <=3.23.0 has an unbounded zlib inflate (GHSA-rgwj-5xj2-c3m3).
  # We only use PostgreSQL, so the MySQL driver never runs. Remove after upgrading prisma past a pin >=3.23.1.
  "prisma>mysql2": "^3.23.1"
  # @prisma/config 7.10 uses deepmerge-ts 7.1.5, which exhausts the stack on recursive object graphs
  # (GHSA-ggr8-5vv4-36mx). It only merges our own prisma.config.ts. 8.0's breaking changes (Map values
  # deep-merge, two renamed types) do not apply to a plain config object.
  "@prisma/config>deepmerge-ts": "^8.0.0"
  # get-uri 8.0.1 pins basic-ftp ^5.3.1; <=6.2.0 has a quadratic-time directory listing parser
  # (GHSA-c475-qrg2-pj4r). Release tooling only (release-it -> proxy-agent), which never speaks FTP.
  # 6.0's only breaking change disables separate FTP transfer hosts by default.
  "get-uri>basic-ftp": "^6.2.1"
  # The docs dev server (webpack-dev-server -> express 4 / body-parser 1.x) resolves qs 6.15.3, which
  # has an array-limit bypass and a DoS (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g). The API on
  # express 5 already resolves 6.16.0.
  qs: "^6.16.0"
  # The same docs dev server chain resolves body-parser 1.20.6, which keeps reading trailing bytes after a
  # compressed request body (DoS, GHSA-27r3-jxmh-p828). 1.20.9 stays within express 4's ~1.20.5 range; the
  # API on express 5 resolves body-parser 2.x and is unaffected.
  "body-parser@<1.20.9": "^1.20.9"
  # sockjs 0.3.24 (docs dev server) pins uuid ^8.3.2, which is missing a buffer bounds check in v3/v5/v6
  # (GHSA-w5hq-g745-h8pq). sockjs only calls v4. 11.1.1 is the oldest patched line that still ships CJS.
  "sockjs>uuid": "^11.1.1"
  # <7.1.6 has quadratic-complexity selector parsing (GHSA-rj75-hqrm-r3gf). Only @tailwindcss/typography
  # (6.0.10 exact pin) and the docs build's cssnano 6 preset (6.1.4) still resolve a 6.x, and they
  # parse our own CSS at build time. 7.0's only change makes insertions during iteration safe.
  "postcss-selector-parser@<7.1.6": "^7.1.6"
  # <=7.29.0 can read arbitrary files via a sourceMappingURL comment (GHSA-4x5r-pxfx-6jf8). 7.26.10 and
  # 7.28.6 come from the apps-sfdx LWC lint/jest toolchain; the rest of the tree is already on 7.29.7.
  "@babel/core": ">=7.29.6 <8.0.0"
  # ts-node 10.9.2 (apps-sfdx jest) pins diff ^4.0.1, and <4.0.4 has a DoS in parsePatch/applyPatch
  # (GHSA-73rr-hh4g-fpgx). 4.0.4 stays within ts-node's declared range.
  "ts-node>diff": "^4.0.4"
