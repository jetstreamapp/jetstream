name: SFDX CI
on:
  push:
    branches:
      - main
    paths:
      - "apps-sfdx/**"
  pull_request:
    paths:
      - "apps-sfdx/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-managed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
        with:
          persist-credentials: false

      # Pinned to an exact version so the CLI (and, via its shipped npm-shrinkwrap, its
      # dependency tree) does not float between runs. Bump deliberately, alongside sfdx-release.yml.
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@2.157.8

      - name: Decode JWT key
        env:
          SFDX_JWT_KEY_BASE64: ${{ secrets.SFDX_JWT_KEY_BASE64 }}
        run: echo "$SFDX_JWT_KEY_BASE64" | base64 --decode > server.key

      - name: Authenticate to Dev Hub
        env:
          SFDX_CONSUMER_KEY: ${{ secrets.SFDX_CONSUMER_KEY }}
          SFDX_DEVHUB_USERNAME: ${{ secrets.SFDX_DEVHUB_USERNAME }}
        run: |
          sf org login jwt \
            --client-id "$SFDX_CONSUMER_KEY" \
            --jwt-key-file server.key \
            --username "$SFDX_DEVHUB_USERNAME" \
            --set-default-dev-hub \
            --alias devhub

      - name: Create Scratch Org
        run: |
          sf org create scratch \
            --definition-file apps-sfdx/config/project-scratch-def.json \
            --set-default \
            --alias ci-scratch \
            --no-track-source \
            --duration-days 1 \
            --wait 10

      - name: Deploy Source
        working-directory: apps-sfdx
        run: sf project deploy start --source-dir canvas-app/jetstream

      - name: Run Apex Tests
        run: |
          sf apex run test \
            --test-level RunLocalTests \
            --wait 10 \
            --result-format human \
            --code-coverage

      - name: Delete Scratch Org
        if: always()
        run: sf org delete scratch --no-prompt --target-org ci-scratch || true

      - name: Remove key file
        if: always()
        run: rm -f server.key
