name: CI
on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress runs on the same ref (branch or PR) to avoid redundant runs and save CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max_old_space_size=4096"
  LOG_LEVEL: warn
  NX_CLOUD_DISTRIBUTED_EXECUTION: false
  AUTH_SFDC_CLIENT_ID: ${{ secrets.SFDC_CONSUMER_KEY }}
  AUTH_SFDC_CLIENT_SECRET: ${{ secrets.SFDC_CONSUMER_SECRET }}
  CONTENTFUL_HOST: cdn.contentful.com
  CONTENTFUL_SPACE: wuv9tl5d77ll
  CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  JETSTREAM_AUTH_OTP_SECRET: ${{ secrets.JETSTREAM_AUTH_OTP_SECRET }}
  JETSTREAM_AUTH_SECRET: ${{ secrets.JETSTREAM_AUTH_SECRET }}
  JETSTREAM_AUTH_SSO_SECRET: ${{ secrets.JETSTREAM_AUTH_SSO_SECRET }}
  JETSTREAM_CLIENT_URL: http://localhost:3333/app
  JETSTREAM_POSTGRES_DBURI: postgres://postgres:postgres@localhost:5432/postgres
  PRISMA_TEST_DB_URI: postgres://postgres:postgres@localhost:5432/postgres
  JETSTREAM_SAML_SP_ENTITY_ID_PREFIX: urn:jetstream:test
  JETSTREAM_SERVER_DOMAIN: localhost:3333
  JETSTREAM_SERVER_URL: http://localhost:3333
  JETSTREAM_SESSION_SECRET: ${{ secrets.JETSTREAM_SESSION_SECRET }}
  NX_PUBLIC_AMPLITUDE_KEY: ${{ secrets.NX_PUBLIC_AMPLITUDE_KEY }}
  NX_PUBLIC_CLIENT_URL: "http://localhost:3333/app"
  NX_PUBLIC_SENTRY_DSN: ${{ secrets.NX_PUBLIC_SENTRY_DSN }}
  NX_PUBLIC_SERVER_URL: "http://localhost:3333"
  DESKTOP_ORG_ENCRYPTION_SECRET: ${{ secrets.DESKTOP_ORG_ENCRYPTION_SECRET }}
  SFDC_API_VERSION: "67.0"
  SFDC_CALLBACK_URL: http://localhost:3333/oauth/sfdc/callback
  SFDC_CONSUMER_KEY: ${{ secrets.SFDC_CONSUMER_KEY }}
  SFDC_CONSUMER_SECRET: ${{ secrets.SFDC_CONSUMER_SECRET }}
  SFDC_ENCRYPTION_KEY: ${{ secrets.SFDC_ENCRYPTION_KEY }}
  JWT_ENCRYPTION_KEY: ${{ secrets.JWT_ENCRYPTION_KEY }}

jobs:
  # Lint and formatting. Split out from build-and-test because oxlint/oxfmt need neither the
  # database nor a build, and the whole workspace takes a few seconds to check.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # enforce-module-boundaries reads Nx's *cached* project graph. On a cold checkout that cache
      # does not exist, and the rule downgrades itself to a warning and skips, so boundary
      # violations would pass CI silently. Materialise the graph first.
      - name: Prime the Nx project graph
        run: pnpm nx show projects > /dev/null

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  # Build application
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      # Used for integration tests (notably cron job tests)
      postgres:
        image: postgres:16.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout [master]
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup branch tracking
        if: success() && github.ref != 'refs/heads/main'
        run: git branch --track main origin/main

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # Nx's *local* computation cache, persisted through the GitHub Actions cache. This is not Nx
      # Cloud — nothing leaves GitHub and there is no plan to exhaust. It speeds up typecheck, test
      # and build for projects a change does not touch.
      #
      # Caching builds here is safe because nothing shippable comes out of this workflow: the web
      # app is built on Render, and desktop/web-extension artifacts are built by release.yml and
      # publish-desktop-*.yml, none of which restore this cache. The dist-artifacts upload below is
      # never consumed. Env vars are not declared as Nx inputs, so a cached build can be replayed
      # with different values — that would matter for a shipping build, not a verification one.
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          # The key is per-commit on purpose. Actions cache entries are immutable, so a stable key
          # would freeze the cache at whatever the first run produced and never pick up newly
          # computed task results. restore-keys is what makes it reusable.
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Generate database client
        run: pnpm db:generate

      # Fails when tsconfig project references drift from the dependency graph. Nx refuses to run
      # tasks in that state anyway, so check it up front where the fix (`pnpm nx sync`) is obvious.
      - name: Verify TypeScript project references are in sync
        run: pnpm nx sync:check

      # Bundlers strip types without checking them, so this is the only step that catches type errors
      # (including in spec files, which no build touches).
      - name: Typecheck all projects
        if: github.event_name == 'push'
        run: pnpm typecheck:all

      - name: Typecheck affected projects
        if: github.event_name == 'pull_request'
        run: pnpm typecheck:affected

      - name: Run database migration
        run: pnpm db:migrate

      - name: Test all projects
        if: github.event_name == 'push'
        run: pnpm test:all

      - name: Test affected projects
        if: github.event_name == 'pull_request'
        run: pnpm test:affected

      - name: Build
        if: github.event_name == 'push'
        run: pnpm build:ci

      - name: Build affected
        if: github.event_name == 'pull_request'
        run: pnpm build:affected

      - name: Uploading artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-artifacts
          path: dist

  # Reports as "e2e-shard (1, 4)" … "e2e-shard (4, 4)". Branch protection points at the aggregate
  # "e2e" job below, not at these.
  e2e-shard:
    runs-on: ubuntu-latest
    # Split across 4 machines. Each shard gets its own postgres service, app server and seeded
    # users, so the only resource shared between them is the Salesforce org.
    # fail-fast is off so one shard failing still lets the others report.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
      E2E_LOGIN_URL: "https://jetstream-e2e-dev-ed.develop.my.salesforce.com"
      E2E_LOGIN_USERNAME: "integration@jetstream.app.e2e"
      SFDC_CI_CONSUMER_KEY: ${{ secrets.SFDC_CI_CONSUMER_KEY }}
      SFDC_CI_PRIVATE_KEY_BASE64: ${{ secrets.SFDC_CI_PRIVATE_KEY_BASE64 }}
      EXAMPLE_USER_OVERRIDE: true
      EXAMPLE_USER_PASSWORD: "EXAMPLE_123!"

    services:
      postgres:
        image: postgres:16.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout [master]
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup-e2e
        with:
          # jetstream-e2e is listed so a change that only touches the suite itself (a spec, the a11y
          # baseline, the shared page objects) still runs it — api/jetstream alone would skip those.
          affected-projects: api|jetstream|jetstream-e2e
          suite-name: E2E

      # build:ci compiles all nine apps; E2E only reaches three of them. api/src/main.ts statically
      # serves ../landing (auth pages) and ../jetstream (the app), and nothing in the suite touches
      # canvas, the web extension, desktop, geo-ip-api or cron-tasks.
      - name: Build
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm build:e2e

      - name: Run database migration
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm db:migrate

      - name: Seed DB
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm db:seed
        env:
          POSTGRES_HOST: localhost
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Run E2E tests
        if: steps.setup.outputs.should_run == 'true'
        run: >-
          pnpm start-server-and-test --expect 200
          'pnpm start:e2e' http://localhost:3333
          'pnpm playwright test src --config apps/jetstream-e2e/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}'

      # Blob reports are merged into one HTML report by the merge-e2e-reports job below.
      - name: Upload blob report
        # Upload even on failure, but only when the suite actually ran.
        if: always() && steps.setup.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/jetstream-e2e/blob-report
          retention-days: 1
          if-no-files-found: ignore

      # Raw axe-core scan results from the a11y specs — evidence artifacts for the accessibility
      # conformance report (VPAT) and inputs to scripts/a11y-merge-baseline.mjs.
      - name: Upload a11y scan results
        if: always() && steps.setup.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-results-${{ matrix.shardIndex }}
          path: apps/jetstream-e2e/a11y-results
          retention-days: 30
          # Only the shard(s) that ran an a11y spec produce results; `warn` (not `ignore`) keeps a
          # silently-not-running a11y spec visible in the job log.
          if-no-files-found: warn

  # Playwright's _electron support needs a real BrowserWindow, which a headless GitHub-hosted
  # runner has no display server for — xvfb-run provides a virtual one. Single job, single worker
  # (no sharding, unlike e2e-shard): Electron launches are heavier than browser contexts and there's
  # no data yet on safe parallelism.
  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_LOGIN_URL: "https://jetstream-e2e-dev-ed.develop.my.salesforce.com"
      E2E_LOGIN_USERNAME: "integration@jetstream.app.e2e"
      SFDC_CI_CONSUMER_KEY: ${{ secrets.SFDC_CI_CONSUMER_KEY }}
      SFDC_CI_PRIVATE_KEY_BASE64: ${{ secrets.SFDC_CI_PRIVATE_KEY_BASE64 }}
      EXAMPLE_USER_OVERRIDE: true
      EXAMPLE_USER_PASSWORD: "EXAMPLE_123!"

    services:
      postgres:
        image: postgres:16.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout [master]
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup-e2e
        with:
          affected-projects: jetstream-desktop|jetstream-desktop-client|jetstream-desktop-e2e
          suite-name: Desktop E2E

      # api statically serves ../landing (auth pages, used by global.setup.ts's UI login) and
      # ../jetstream, so both are needed even though this suite never opens the web app itself.
      # jetstream-desktop is the main process the tests launch. jetstream-desktop-client is
      # deliberately absent: it is served by the Vite dev server (start:desktop:client), which
      # compiles on demand and never reads a production build.
      - name: Build
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm nx run-many --target=build --projects=api,jetstream,landing,jetstream-desktop --configuration=production

      # Electron's real BrowserWindow needs a display server, which this runner doesn't have —
      # the `xvfb-run` wrapper inside the e2e-ci target provides a virtual one. Not part of
      # Playwright's own system deps.
      - name: Install Xvfb
        if: steps.setup.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run database migration
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm db:migrate

      - name: Seed DB
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm db:seed
        env:
          POSTGRES_HOST: localhost
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      # Both servers, xvfb and Playwright all live in the e2e-ci target so this invocation and a
      # local one cannot drift apart.
      - name: Run Desktop E2E tests
        if: steps.setup.outputs.should_run == 'true'
        run: pnpm nx run jetstream-desktop-e2e:e2e-ci

      - name: Upload Playwright report
        if: always() && steps.setup.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-report
          path: apps/jetstream-desktop-e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      # A few hundred KB against the HTML report's tens of MB, so it is kept far longer — this is
      # what `pnpm ci:failures --no-report` reads, and the only record left once the report expires.
      - name: Upload JSON summary
        if: always() && steps.setup.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-playwright-summary
          path: apps/jetstream-desktop-e2e/playwright-summary.json
          retention-days: 30
          if-no-files-found: ignore

  # Stitches the 4 shard reports back into the single HTML report the old job produced.
  merge-e2e-reports:
    if: always() && !cancelled()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # The E2E job exits successfully without producing reports when the affected-guard skips it,
      # so an empty download here is expected rather than an error.
      #
      # Both reporters run off one merge: `html` for a human to open, `json` as a machine-readable
      # summary of every result. Only the JSON name needs directing; `html` defaults to
      # ./playwright-report, which is what the upload below expects.
      - name: Merge into HTML report and JSON summary
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-summary.json
        run: |
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "::notice::No blob reports found — E2E was skipped by the affected guard"
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Upload HTML report
        if: hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # A few hundred KB against the HTML report's ~45MB, so it is worth keeping around longer.
      # `pnpm ci:failures --no-report` reads this to explain a failure without the large download,
      # and it is the only source left once the HTML report expires.
      - name: Upload JSON summary
        if: hashFiles('playwright-summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-summary
          path: playwright-summary.json
          retention-days: 30

  # The check branch protection points at.
  #
  # A matrix job reports one context per shard ("e2e-shard (1, 4)" … "e2e-shard (4, 4)") and none
  # under its own job name, so protecting the matrix directly would wait forever on a context that
  # never reports. This job carries the plain "e2e" name instead, so the existing branch rule keeps
  # working and stays correct if the shard count ever changes.
  #
  # `needs['e2e-shard'].result` aggregates every shard: success only when all of them succeeded.
  # The bracket form is required — `needs.e2e-shard` would parse as a subtraction.
  e2e:
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all e2e shards passed
        run: |
          echo "e2e matrix result: ${{ needs['e2e-shard'].result }}"
          if [ "${{ needs['e2e-shard'].result }}" != "success" ]; then
            echo "::error::E2E did not pass (result: ${{ needs['e2e-shard'].result }})"
            exit 1
          fi
